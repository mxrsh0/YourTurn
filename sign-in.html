<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your YourTurn account.">
  <title>Sign In — YourTurn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="auth-brand" href="index.html">YourTurn</a>
    <a class="auth-back" href="index.html">Back to YourTurn</a>
  </header>
  <main class="auth-main">
    <section class="auth-layout" aria-labelledby="sign-in-title">
      <aside class="auth-intro">
        <p class="auth-label">Your job search</p>
        <h1>Welcome back.</h1>
        <p>Keep your applications, saved opportunities and updates together in one place.</p>
      </aside>
      <div class="auth-form-wrap">
        <h2 id="sign-in-title">Sign in</h2>
        <p class="auth-subtitle">Use the email address and password linked to your YourTurn account.</p>
        <form class="auth-form" id="sign-in-form">
          <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
          <p class="form-message" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Sign in</button>
        </form>
        <p class="auth-switch">New to YourTurn? <a href="create-account.html">Create an account</a></p>
      </div>
    </section>
  </main>
</body>
</html>
