<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YourTurn — Upload CV</title><link rel="stylesheet" href="css/onboarding.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"></head><body><main class="onboarding-shell"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="onboarding-top"><a class="brand" href="index.html"><span class="brand-mark">Y</span><span>YourTurn</span><span class="beta-badge">BETA</span></a><a class="exit-link" href="cv-choice.html">Back</a></header><section class="onboarding-main"><div class="step-card fade-in"><p class="eyebrow"><span class="eyebrow-dot"></span> Existing CV</p><h1>Bring your CV to <span>YourTurn.</span></h1><p class="intro">Upload your current CV and we'll use it as the starting point for analysis. PDF and Word documents are supported.</p><label class="upload-box" for="cv-file"><span class="choice-icon">↑</span><strong id="file-label">Choose your CV</strong><span>PDF, DOC or DOCX</span><input id="cv-file" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><div id="upload-status" class="auth-status"></div><div class="actions"><a class="skip" href="cv-choice.html">Back</a><button id="upload-next" class="btn btn-primary" type="button" disabled>Continue <span class="btn-arrow">→</span></button></div></div></section></main><script>const f=document.getElementById('cv-file'),l=document.getElementById('file-label'),b=document.getElementById('upload-next');f.addEventListener('change',()=>{const x=f.files[0];if(!x)return;l.textContent=x.name;b.disabled=false;b.onclick=()=>{sessionStorage.setItem('yourturn_cv_filename',x.name);location.href='cv-analysis.html'}});</script></body></html>
