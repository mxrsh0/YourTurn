<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourTurn — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/onboarding.css">
</head>
<body>
<main class="onboarding-shell"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<header class="onboarding-top"><a class="brand" href="index.html"><span class="brand-mark">Y</span><span>YourTurn</span><span class="beta-badge">BETA</span></a><a class="exit-link" href="index.html">Back to welcome</a></header>
<section class="onboarding-main"><div class="step-card fade-in">
<p class="eyebrow"><span class="eyebrow-dot"></span> Welcome back</p><h1>Sign in to <span>YourTurn.</span></h1><p class="intro">Pick up where you left off and continue building your job search.</p>
<form id="signin-form"><div class="form-grid">
<div class="field full"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field full"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></div>
</div>
<div id="signin-status" class="auth-status" aria-live="polite"></div>
<div class="actions"><a class="skip" href="account.html">Create an account</a><button id="signin-submit" class="btn btn-primary" type="submit">Sign in <span class="btn-arrow">→</span></button></div>
</form></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js?v=3"></script><script src="js/signin.js?v=1"></script>
</body></html>
