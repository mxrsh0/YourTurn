<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourTurn — Your profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/onboarding.css"><link rel="stylesheet" href="css/bright-theme.css?v=1">
</head>
<body><main class="onboarding-shell"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<header class="onboarding-top"><a class="brand" href="index.html"><span class="brand-mark">Y</span><span>YourTurn</span><span class="beta-badge">BETA</span></a><button id="signout" class="exit-link" type="button">Sign out</button></header>
<div class="progress-wrap"><div class="progress-label"><span>Getting started</span><span>2 of 4</span></div><div class="progress-track"><div class="progress-bar" style="width:50%"></div></div></div>
<section class="onboarding-main"><div class="step-card fade-in">
<p class="eyebrow"><span class="eyebrow-dot"></span> Your starting profile</p><h1>Let's make your search <span>more personal.</span></h1><p class="intro">Tell us what you want from work. You can change these details later, and we'll use them to make your job search more useful.</p>
<form id="profile-form"><div class="form-grid">
<div class="field full"><label for="full-name">Name</label><input id="full-name" autocomplete="name" placeholder="Your name"></div>
<div class="field"><label for="location">Location</label><input id="location" autocomplete="address-level2" placeholder="e.g. Manchester"></div>
<div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" placeholder="Optional"></div>
<div class="field full"><label for="contact">How should employers/YourTurn contact you?</label><select id="contact"><option value="email">Email</option><option value="phone">Phone</option><option value="either">Email or phone</option><option value="yourturn">Through YourTurn first</option></select></div>
<div class="field full"><label for="roles">Roles you're interested in</label><input id="roles" placeholder="e.g. 3D Artist, Environment Artist, Junior Artist"><p class="helper">Separate multiple roles with commas.</p></div>
<div class="field full"><label for="summary">What are you looking for?</label><textarea id="summary" rows="5" placeholder="Tell us about the kind of work, industry, environment or goals you're interested in."></textarea></div>
</div><div id="profile-status" class="auth-status" aria-live="polite"></div>
<div class="actions"><a class="skip" href="cv.html">Skip for now</a><button id="profile-submit" class="btn btn-primary" type="submit">Save & continue <span class="btn-arrow">→</span></button></div></form></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js?v=4"></script><script src="js/profile.js?v=1"></script>
</body></html>
