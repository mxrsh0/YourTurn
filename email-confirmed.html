<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Confirmed — YourTurn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
<style>
.confirmation-card{width:min(620px,100%);padding:clamp(2.5rem,7vw,5rem);border:1px solid #deded9;border-radius:14px;background:#fbfaf8;box-shadow:0 18px 45px rgba(28,33,38,.08)}
.confirmation-card h1{margin:0 0 1rem;color:#20252b;font-size:clamp(2.6rem,7vw,4.8rem);line-height:1;letter-spacing:-.065em;font-weight:650}
.confirmation-card>p:not(.auth-label){max-width:500px;margin:0;color:#737a82;line-height:1.75}
.confirmation-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.auth-link-button{display:inline-flex;align-items:center;justify-content:center;padding:0 1.25rem;text-decoration:none}
.auth-secondary{display:inline-flex;align-items:center;justify-content:center;min-height:49px;padding:0 1.25rem;border:1px solid #d5d5d0;border-radius:7px;color:#344b61;background:#fff;text-decoration:none;font-size:.9rem;font-weight:600}
@media(max-width:600px){.confirmation-actions>*{width:100%}}
</style>
</head>
<body class="auth-page">
<header class="auth-header">
<a class="auth-brand" href="index.html">YourTurn</a>
<a class="auth-back" href="index.html">Back to YourTurn</a>
</header>
<main class="auth-main">
<section class="confirmation-card" aria-labelledby="confirmed-title">
<p class="auth-label">Email confirmed</p>
<h1 id="confirmed-title">You're all set.</h1>
<p>Your email address has been confirmed and your YourTurn account is ready to use. You can now sign in and continue to your job search.</p>
<div class="confirmation-actions">
<a class="auth-submit auth-link-button" href="sign-in.html">Sign in to YourTurn</a>
<a class="auth-secondary" href="index.html">Return to homepage</a>
</div>
</section>
</main>
</body>
</html>
