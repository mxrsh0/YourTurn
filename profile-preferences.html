<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job preferences — YourTurn</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="profile.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js" defer></script><script src="profile.js" defer></script></head><body data-profile-page="preferences"><main class="profile-shell"><header class="profile-header"><a class="profile-brand" href="index.html">YourTurn</a><span class="profile-step">Preferences · 2 of 3</span></header><section class="profile-card"><div class="profile-intro"><p class="profile-kicker">JOB PREFERENCES</p><h1 class="profile-title">What kind of work suits you?</h1><p class="profile-lead">Use the sliders to tell us what you would consider. These aren't commitments — they simply help narrow the jobs we show you.</p></div><form><div class="choice-grid"><div class="choice"><div class="choice-head"><label>Warehouse jobs</label><span class="range-value" data-output="warehouse"></span></div><input data-pref name="warehouse" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Retail</label><span class="range-value" data-output="retail"></span></div><input data-pref name="retail" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Care environments</label><span class="range-value" data-output="care"></span></div><input data-pref name="care" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Hospitality</label><span class="range-value" data-output="hospitality"></span></div><input data-pref name="hospitality" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>High-responsibility roles</label><span class="range-value" data-output="high_responsibility"></span></div><input data-pref name="high_responsibility" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Career-focused jobs</label><span class="range-value" data-output="career_role"></span></div><input data-pref name="career_role" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Office and administration</label><span class="range-value" data-output="office_admin"></span></div><input data-pref name="office_admin" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Customer service</label><span class="range-value" data-output="customer_service"></span></div><input data-pref name="customer_service" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Driving and delivery</label><span class="range-value" data-output="driving"></span></div><input data-pref name="driving" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Construction</label><span class="range-value" data-output="construction"></span></div><input data-pref name="construction" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Manufacturing</label><span class="range-value" data-output="manufacturing"></span></div><input data-pref name="manufacturing" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Cleaning</label><span class="range-value" data-output="cleaning"></span></div><input data-pref name="cleaning" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Security</label><span class="range-value" data-output="security"></span></div><input data-pref name="security" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Outdoor work</label><span class="range-value" data-output="outdoors"></span></div><input data-pref name="outdoors" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Remote work</label><span class="range-value" data-output="remote_work"></span></div><input data-pref name="remote_work" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Hybrid work</label><span class="range-value" data-output="hybrid_work"></span></div><input data-pref name="hybrid_work" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Temporary work</label><span class="range-value" data-output="temporary_work"></span></div><input data-pref name="temporary_work" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Permanent work</label><span class="range-value" data-output="permanent_work"></span></div><input data-pref name="permanent_work" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Temp-to-permanent</label><span class="range-value" data-output="temp_to_perm"></span></div><input data-pref name="temp_to_perm" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Apprenticeships</label><span class="range-value" data-output="apprenticeships"></span></div><input data-pref name="apprenticeships" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Entry-level roles</label><span class="range-value" data-output="entry_level"></span></div><input data-pref name="entry_level" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Management</label><span class="range-value" data-output="management"></span></div><input data-pref name="management" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Shift work</label><span class="range-value" data-output="shift_work"></span></div><input data-pref name="shift_work" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Night work</label><span class="range-value" data-output="night_work"></span></div><input data-pref name="night_work" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Weekend work</label><span class="range-value" data-output="weekend_work"></span></div><input data-pref name="weekend_work" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Full-time</label><span class="range-value" data-output="full_time"></span></div><input data-pref name="full_time" type="range" min="0" max="2" step="1" value="0"></div><div class="choice"><div class="choice-head"><label>Part-time</label><span class="range-value" data-output="part_time"></span></div><input data-pref name="part_time" type="range" min="0" max="2" step="1" value="0"></div></div><p class="form-message" aria-live="polite"></p><div class="profile-actions"><button class="primary-btn" type="submit">Continue</button></div></form></section></main></body></html>
